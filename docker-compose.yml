services:
  backend:
    build:  
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:4000"
    environment:
      MONGO_URI: ${MONGODB_URI}
    depends_on:
      - db

  db:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: