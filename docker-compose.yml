services:
  backend:
    image: beejay12/taskmanager-backend:latest
    restart: always
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: ${MONGODB_URI}
    depends_on:
      - db

  db:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: